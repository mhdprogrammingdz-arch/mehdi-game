name: Build downloadable game ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Create ZIP package
        run: |
          zip -r MEHDI-BRAIN-CHALLENGE.zip . \
            -x ".git/*" ".github/*"
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: MEHDI-BRAIN-CHALLENGE
          path: MEHDI-BRAIN-CHALLENGE.zip
          retention-days: 7
